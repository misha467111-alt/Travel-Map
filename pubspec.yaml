name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.5.3
  image_picker: ^1.0.7
  # Phase 2.2A1: pure-Dart location-photo normalization (EXIF/GPS strip,
  # orientation bake, resize, JPEG re-encode). Already resolved
  # transitively at 4.9.2 (pulled in via image_picker); pinned here as a
  # direct dependency since lib/features/map/domain/
  # location_photo_normalizer.dart now calls it directly. Pure Dart, no
  # native/platform code, so its behavior (and EXIF stripping in
  # particular) is directly verifiable in plain `flutter test`.
  image: ^4.9.2
  geolocator: ^10.1.0
  supabase_flutter: ^2.5.4
  shared_preferences: ^2.2.2
  http: ^1.2.0
  uuid: ^4.3.0
  cached_network_image: ^3.4.1
  flutter_riverpod: ^3.4.2
  go_router: ^14.8.1
  riverpod_annotation: ^4.0.6
  connectivity_plus: ^7.3.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  # GPS-4B2.2: pinned below the latest umbrella releases (13.0.0/13.0.1/
  # 13.0.2), which all require permission_handler_android >=14.0.0 --
  # confirmed by reading permission_handler_android 14.0.0's *and* 14.1.0's
  # own android/build.gradle.kts, both declare compileSdk = 37, above this
  # project's compileSdk 36 and above Android Gradle Plugin 9.0.1's own
  # recommended ceiling (see android/settings.gradle). permission_handler
  # 12.0.3 is the newest umbrella release still constrained to
  # permission_handler_android ^13.0.0 (confirmed via pub.dev's package
  # API, not guessed); the explicit permission_handler_android pin below
  # keeps resolution at exactly 13.0.1, confirmed via its own
  # android/build.gradle to declare compileSdkVersion 35.
  permission_handler: 12.0.3
  permission_handler_android: 13.0.1
dependency_overrides:
  google_maps_flutter_android:
    path: third_party/google_maps_flutter_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  assets:
    - assets/map_styles/travel_light_map.json

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 4
